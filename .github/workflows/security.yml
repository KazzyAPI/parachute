name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Reviewed exceptions (the repo bans Go comments, so the reasons live here):
      #   tools/trace          G304 G703  dev tool reading repo files it just globbed
      #   internal/osys        G304       the OS adapter reads operator-configured paths
      #   internal/api/server  G102       the API listens in a container; the operator publishes the port
      #   internal/config/removed G101    placeholder URL shown in an error message
      - run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          -exclude-dir=e2e -exclude-dir=.claude
          "-exclude-rules=tools/trace/.*:G304,G703;internal/osys/system.go:G304;internal/api/server.go:G102;internal/config/removed.go:G101"
          ./...
